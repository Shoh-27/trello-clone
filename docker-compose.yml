version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: trello_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trello_db
      POSTGRES_USER: trello_user
      POSTGRES_PASSWORD: trello_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trello_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trello_user -d trello_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    # pgAdmin - PostgreSQL GUI Management Tool
  pgadmin:
      image: dpage/pgadmin4:latest
      container_name: trello_pgadmin
      restart: unless-stopped
      environment:
        PGADMIN_DEFAULT_EMAIL: admin@trello.local
        PGADMIN_DEFAULT_PASSWORD: admin123
        PGADMIN_CONFIG_SERVER_MODE: 'False'
        PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      ports:
        - "5050:80"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
      networks:
        - trello_network
      depends_on:
        - db
      # Note: Access pgAdmin at http://localhost:5050
      # To connect to PostgreSQL: Host=db, Port=5432, User=trello_user, Password=trello_secret


volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local
  vendor_volume:
    driver: local
  node_modules_frontend:
    driver: local
  node_modules_socket:
    driver: local

networks:
  trello_network:
    driver: bridge